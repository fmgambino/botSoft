<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>ISM Robosoft | Acceso</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css?v=40.0" />
</head>
<body class="auth-page">
  <main class="login-shell compact auth-single">
    <section class="auth-card glass auth-card-clean">
      <img src="./assets/img/logo-Coordinacion-Robotica.png" alt="Instituto San Miguel" class="brand-logo large centered-logo" />
      <span class="badge">Acceso seguro</span>
      <h2>Ingresar al panel</h2>
      <p class="muted">Usá tu email y contraseña. Las cuentas nuevas deben ser autorizadas por un administrador.</p>
      <form id="loginForm" class="form-grid single-col">
        <label><span>Usuario o correo electrónico</span><input type="text" id="email" placeholder="usuario@correo.com" autocomplete="username" required /></label>
        <label><span>Contraseña</span><input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required /></label>
        <button class="btn btn-primary" type="submit">Ingresar</button>
      </form>
      <div class="auth-links-row">
        <a class="btn btn-primary" href="./registro.html">Registrarse</a><a class="btn btn-secondary" href="./recuperar.html">Recuperar contraseña</a>
      </div>
      <p id="authMessage" class="form-message"></p>
      <a class="cafecito-auth" href="https://cafecito.app/fmgambino" rel="noopener" target="_blank"><img srcset="https://cdn.cafecito.app/imgs/buttons/button_3.png 1x, https://cdn.cafecito.app/imgs/buttons/button_3_2x.png 2x, https://cdn.cafecito.app/imgs/buttons/button_3_3.75x.png 3.75x" src="https://cdn.cafecito.app/imgs/buttons/button_3.png" alt="Invitame un café en cafecito.app" /></a>
    </section>
  </main>
  <footer class="site-footer modern-footer"><div class="footer-brand">ISM ROBOSOFT© 2026</div><div class="footer-copy">Tucumán · Argentina · by <a href="https://electronicagambino.com" rel="noopener" target="_blank">Ing. Fernando Gambino</a></div><div class="footer-rights">Todos los Derechos Registrados · @ Cafecito</div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js?v=10.2"></script>
  <script src="./js/supabaseClient.js?v=40.0"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations?.().then(rs => rs.forEach(r => r.unregister())).catch(()=>{});</script>

  <script>
  (async function(){
    try {
      const cfg = window.APP_CONFIG || window.SUPABASE_CONFIG || {};
      const url = cfg.supabaseUrl || cfg.url || cfg.SUPABASE_URL || window.SUPABASE_URL;
      const key = cfg.supabaseAnonKey || cfg.anonKey || cfg.SUPABASE_ANON_KEY || window.SUPABASE_ANON_KEY;
      const local = JSON.parse(localStorage.getItem('ism_general_settings') || '{}');
      const apply = (gs={}) => {
        const data = {...local, ...gs};
        if (data.logoDataUrl) document.querySelectorAll('.brand-logo,.centered-logo').forEach(i=>i.src=data.logoDataUrl);
        if (data.institutionName) document.querySelector('img.brand-logo')?.setAttribute('alt', data.institutionName);
      };
      apply(local);
      if (window.supabase && url && key) {
        const c = window.supabase.createClient(url, key);
        const { data } = await c.from('app_settings').select('value').eq('key','general_config').maybeSingle();
        if (data?.value) { localStorage.setItem('ism_general_settings', JSON.stringify(data.value)); apply(data.value); }
      }
    } catch(e) { console.warn('branding login', e); }
  })();
  </script>
  <script src="./auth.js?v=10.2"></script>
</body>
</html>
